name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  green-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@envisioning'
      # @envisioning/app is private on GitHub Packages (D104). The repo secret
      # is a classic PAT with read:packages; without it the job token is tried,
      # which needs this repo granted read under the package's Actions access.
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      - run: pnpm test
      - run: pnpm bench validate
      - run: pnpm build
      - run: pnpm typecheck
