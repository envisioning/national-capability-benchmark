name: Provisional review cadence

on:
  schedule:
    - cron: '0 9 8 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm reviews:check
