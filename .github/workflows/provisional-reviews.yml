name: Provisional review cadence

on:
  schedule:
    - cron: '0 9 8 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  review-cadence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@envisioning'
      # @envisioning/app is private on GitHub Packages (D104). The repo secret
      # is a classic PAT with read:packages; without it the job token is tried,
      # which needs this repo granted read under the package's Actions access.
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
      - run: pnpm reviews:check
